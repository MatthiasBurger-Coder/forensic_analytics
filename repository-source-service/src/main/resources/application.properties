forensics.repository-source.service.grpc.enabled=true
forensics.repository-source.service.grpc.host=127.0.0.1
forensics.repository-source.service.grpc.port=9092
forensics.repository-source.service.health.enabled=true
forensics.repository-source.service.health.host=127.0.0.1
forensics.repository-source.service.health.port=8083
forensics.repository-source.service.workspace.root=build/repository-source-workspaces
forensics.repository-source.service.persistence.type=postgres
forensics.repository-source.service.persistence.postgres.jdbc-url=${FORENSICS_REPOSITORY_SOURCE_POSTGRES_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/forensic_analytics}
forensics.repository-source.service.persistence.postgres.username=${FORENSICS_REPOSITORY_SOURCE_POSTGRES_USERNAME:forensic}
forensics.repository-source.service.persistence.postgres.password=${FORENSICS_REPOSITORY_SOURCE_POSTGRES_PASSWORD:}
forensics.repository-source.service.persistence.postgres.schema=${FORENSICS_REPOSITORY_SOURCE_POSTGRES_SCHEMA:repository_source}
forensics.repository-source.service.persistence.postgres.change-log=classpath:db/changelog/repository-source-workspace.postgresql.yaml
