services:
  forensic-postgres:
    image: postgres:18-alpine
    container_name: forensic-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forensic_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-forensic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=de-DE"
      REPOSITORY_SOURCE_DB_USER: ${REPOSITORY_SOURCE_DB_USER:-repository_source}
      REPOSITORY_SOURCE_DB_PASSWORD: ${REPOSITORY_SOURCE_DB_PASSWORD:-change-me-repository-source}
      REPOSITORY_SOURCE_DB_SCHEMA: ${REPOSITORY_SOURCE_DB_SCHEMA:-repository_source}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - forensic_postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro

    networks:
      - repository_source_db

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  forensic-pgadmin:
    image: dpage/pgadmin4:9
    container_name: forensic-pgadmin
    restart: unless-stopped
    depends_on:
      forensic-postgres:
        condition: service_healthy

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-pgadmin}

    ports:
      - "127.0.0.1:${PGADMIN_PORT:-15432}:80"

    volumes:
      - forensic_pgadmin_data:/var/lib/pgadmin

    networks:
      - repository_source_db

volumes:
  forensic_postgres_data:
    name: forensic_postgres_data
  forensic_pgadmin_data:
    name: forensic_pgadmin_data

networks:
  repository_source_db:
    name: forensic_repository_source_db
    external: true
