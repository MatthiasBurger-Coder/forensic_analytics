server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api {
        default_type application/json;
        return 502 '{"code":"BACKEND_UNAVAILABLE","message":"REST backend proxy is not configured","retryable":true,"correlationId":null,"diagnostics":["Configure VITE_API_BASE_URL at build time or provide a reverse proxy."]}';
    }

    location /api/ {
        default_type application/json;
        return 502 '{"code":"BACKEND_UNAVAILABLE","message":"REST backend proxy is not configured","retryable":true,"correlationId":null,"diagnostics":["Configure VITE_API_BASE_URL at build time or provide a reverse proxy."]}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
