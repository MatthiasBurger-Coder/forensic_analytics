spring.application.name=query-report-api-service
spring.main.web-application-type=none
spring.main.banner-mode=off
forensics.query-report-api.service.http.enabled=true
forensics.query-report-api.service.http.host=0.0.0.0
forensics.query-report-api.service.http.port=8080
forensics.query-report-api.service.analysis-orchestrator.grpc.host=analysis-orchestrator-service
forensics.query-report-api.service.analysis-orchestrator.grpc.port=9098
forensics.query-report-api.service.analysis-orchestrator.grpc.deadline-seconds=5
forensics.query-report-api.service.repository-source.grpc.host=repository-source-service
forensics.query-report-api.service.repository-source.grpc.port=9092
forensics.query-report-api.service.repository-source.grpc.deadline-seconds=5
forensics.query-report-api.service.workspace.schema-version=query-report-workspace.v1
forensics.query-report-api.service.workspace.metadata.timeout-seconds=60
forensics.query-report-api.service.workspace.refresh.ephemeral=false
forensics.query-report-api.service.workspace.refresh.allow-shallow-clone=true
forensics.query-report-api.service.workspace.refresh.allow-partial-clone=false
forensics.query-report-api.service.workspace.refresh.allow-sparse-checkout=false
forensics.query-report-api.service.workspace.refresh.timeout-seconds=60
forensics.query-report-api.service.workspace.refresh.max-workspace-bytes=1073741824
