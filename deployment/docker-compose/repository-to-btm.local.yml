name: forensic-analytics-repository-to-btm

services:
  forensic-gateway-service:
    image: forensic-analytics/forensic-gateway-service:local
    build:
      context: ../..
      dockerfile: forensic-gateway-service/Dockerfile
      args:
        SERVICE_JAR: forensic-gateway-service/build/libs/forensic-gateway-service-0.1.0-SNAPSHOT.jar
    depends_on:
      analysis-store-service:
        condition: service_healthy
      repository-analysis-service:
        condition: service_healthy
      java-ast-analysis-service:
        condition: service_healthy
      joern-cpg-analysis-service:
        condition: service_healthy
      btm-generation-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"

  analysis-store-service:
    image: forensic-analytics/analysis-store-service:local
    build:
      context: ../..
      dockerfile: analysis-store-service/Dockerfile
      args:
        SERVICE_JAR: analysis-store-service/build/libs/analysis-store-service-0.1.0-SNAPSHOT.jar
    ports:
      - "127.0.0.1:18082:8082"
      - "127.0.0.1:19091:9091"

  repository-analysis-service:
    image: forensic-analytics/repository-analysis-service:local
    build:
      context: ../..
      dockerfile: repository-analysis-service/Dockerfile
      args:
        SERVICE_JAR: repository-analysis-service/build/libs/repository-analysis-service-0.1.0-SNAPSHOT.jar
    depends_on:
      java-ast-analysis-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:18083:8083"
      - "127.0.0.1:19092:9092"

  repository-source-service:
    image: forensic-analytics/repository-source-service:local
    build:
      context: ../..
      dockerfile: repository-source-service/Dockerfile
      args:
        SERVICE_JAR: repository-source-service/build/libs/repository-source-service-0.1.0-SNAPSHOT.jar
    ports:
      - "127.0.0.1:18087:8083"
      - "127.0.0.1:19097:9092"
    command:
      - --forensics.repository-source.service.persistence.type=postgres
    environment:
      FORENSICS_REPOSITORY_SOURCE_POSTGRES_JDBC_URL: jdbc:postgresql://forensic-postgres:5432/${POSTGRES_DB:-forensic_analytics}
      FORENSICS_REPOSITORY_SOURCE_POSTGRES_USERNAME: ${REPOSITORY_SOURCE_DB_USER:-repository_source}
      FORENSICS_REPOSITORY_SOURCE_POSTGRES_PASSWORD: ${REPOSITORY_SOURCE_DB_PASSWORD:-change-me-repository-source}
      FORENSICS_REPOSITORY_SOURCE_POSTGRES_SCHEMA: ${REPOSITORY_SOURCE_DB_SCHEMA:-repository_source}
    volumes:
      - repository-source-workspaces:/var/lib/forensic-analytics/repository-workspaces
    networks:
      - default
      - repository_source_db

  java-ast-analysis-service:
    image: forensic-analytics/java-ast-analysis-service:local
    build:
      context: ../..
      dockerfile: java-ast-analysis-service/Dockerfile
      args:
        SERVICE_JAR: java-ast-analysis-service/build/libs/java-ast-analysis-service-0.1.0-SNAPSHOT.jar
    ports:
      - "127.0.0.1:18084:8084"
      - "127.0.0.1:19093:9093"
    volumes:
      - java-ast-artifacts:/var/lib/forensic-analytics/java-ast-artifacts

  joern-cpg-analysis-service:
    image: forensic-analytics/joern-cpg-analysis-service:local
    build:
      context: ../..
      dockerfile: joern-cpg-analysis-service/Dockerfile
      args:
        SERVICE_JAR: joern-cpg-analysis-service/build/libs/joern-cpg-analysis-service-0.1.0-SNAPSHOT.jar
    ports:
      - "127.0.0.1:18085:8085"
      - "127.0.0.1:19094:9094"
    volumes:
      - joern-cpg-workspaces:/var/lib/forensic-analytics/joern-cpg-workspaces
      - joern-cpg-artifacts:/var/lib/forensic-analytics/joern-cpg-artifacts

  btm-generation-service:
    image: forensic-analytics/btm-generation-service:local
    build:
      context: ../..
      dockerfile: btm-generation-service/Dockerfile
      args:
        SERVICE_JAR: btm-generation-service/build/libs/btm-generation-service-0.1.0-SNAPSHOT.jar
    ports:
      - "127.0.0.1:18086:8086"
      - "127.0.0.1:19095:9095"
    volumes:
      - btm-artifacts:/var/lib/forensic-analytics/btm-artifacts

volumes:
  repository-source-workspaces:
  java-ast-artifacts:
  joern-cpg-workspaces:
  joern-cpg-artifacts:
  btm-artifacts:

networks:
  default:
    name: forensic_analytics
    external: true
  repository_source_db:
    name: forensic_repository_source_db
    external: true
