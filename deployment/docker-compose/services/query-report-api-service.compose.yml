services:
  query-report-api-service:
    image: forensic-analytics/query-report-api-service:local
    build:
      context: ../../..
      dockerfile: query-report-api-service/Dockerfile
      args:
        SERVICE_JAR: query-report-api-service/build/libs/query-report-api-service-0.1.0-SNAPSHOT.jar
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - forensic_analytics

networks:
  forensic_analytics:
    name: forensic_analytics
    external: true
