syntax = "proto3";

package de.burger.forensics.analytics.btmgeneration.v1;

import "analysis-job.proto";

option java_multiple_files = true;
option java_package = "de.burger.forensics.analytics.btmgeneration.v1";
option java_outer_classname = "BtmGenerationProto";

// Provisional contract for server-side Byteman/BTM generation and public BTM
// artifact delivery.
//
// The service owns deterministic generated rule artifacts only. It must not
// scan repositories, execute JavaParser or Joern, access graph storage, invent
// runtime trace data or claim that generated instrumentation has observed
// runtime behavior.
service BtmGenerationService {
  rpc GenerateBtmRules(GenerateBtmRulesRequest)
      returns (GenerateBtmRulesResponse);
}

// Public facade contract for completed BTM artifact delivery.
//
// Gateway exposes this contract to plugins or external clients only after
// Analysis Store metadata identifies accepted generated artifacts. BTM
// Generation remains the byte owner until an explicit byte-handoff,
// object-store ownership or delivery contract transfers byte custody.
service BtmArtifactDeliveryService {
  rpc DownloadBtmArtifacts(DownloadBtmArtifactsRequest)
      returns (stream BtmArtifactDeliveryMessage);
}

message GenerateBtmRulesRequest {
  string request_id = 1;
  string idempotency_key = 2;
  string schema_version = 3;
  string correlation_id = 4;
  de.burger.forensics.analytics.analysisjob.v1.AnalysisWorkerKind worker_kind = 5;
  de.burger.forensics.analytics.analysisjob.v1.AnalysisRunId analysis_run_id = 6;
  de.burger.forensics.analytics.analysisjob.v1.AnalysisJobId analysis_job_id = 7;
  de.burger.forensics.analytics.analysisjob.v1.SourceSnapshotId source_snapshot_id = 8;
  string worker_version = 9;
  BtmGenerationPolicy policy = 10;
  DeliveredAnalysisFacts facts = 11;
  map<string, string> safe_attributes = 12;
}

message GenerateBtmRulesResponse {
  OperationStatus status = 1;
  de.burger.forensics.analytics.analysisjob.v1.AnalysisRunId analysis_run_id = 2;
  de.burger.forensics.analytics.analysisjob.v1.AnalysisJobId analysis_job_id = 3;
  de.burger.forensics.analytics.analysisjob.v1.SourceSnapshotId source_snapshot_id = 4;
  de.burger.forensics.analytics.analysisjob.v1.AnalysisCompleteness completeness = 5;
  repeated de.burger.forensics.analytics.analysisjob.v1.AnalysisArtifactReference generated_artifacts = 6;
  repeated BtmRuleSummary generated_rules = 7;
  BtmGenerationSummary summary = 8;
  ReproducibilityMetadata reproducibility = 9;
  repeated BtmDiagnostic diagnostics = 10;
  map<string, string> safe_attributes = 11;
}

message DownloadBtmArtifactsRequest {
  string request_id = 1;
  string idempotency_key = 2;
  string schema_version = 3;
  string correlation_id = 4;
  de.burger.forensics.analytics.analysisjob.v1.AnalysisRunId analysis_run_id = 5;
  de.burger.forensics.analytics.analysisjob.v1.AnalysisJobId analysis_job_id = 6;
  // Maximum accepted chunk size. Slice 02 target maximum is 1 MiB.
  int32 max_chunk_bytes = 7;
  // Maximum accepted total delivery size. Slice 02 target maximum is 1 GiB.
  int64 max_total_bytes = 8;
  repeated string artifact_references = 9;
  map<string, string> safe_attributes = 10;
}

message BtmArtifactDeliveryMessage {
  oneof payload {
    BtmArtifactManifest manifest = 1;
    BtmArtifactChunk chunk = 2;
    OperationStatus status = 3;
  }
}

message BtmArtifactManifest {
  string manifest_id = 1;
  de.burger.forensics.analytics.analysisjob.v1.AnalysisRunId analysis_run_id = 2;
  de.burger.forensics.analytics.analysisjob.v1.AnalysisJobId analysis_job_id = 3;
  de.burger.forensics.analytics.analysisjob.v1.SourceSnapshotId source_snapshot_id = 4;
  de.burger.forensics.analytics.analysisjob.v1.AnalysisCompleteness completeness = 5;
  repeated BtmArtifactDescriptor artifacts = 6;
  int64 total_size_bytes = 7;
  string manifest_sha256 = 8;
  string delivery_order = 9;
}

message BtmArtifactDescriptor {
  string artifact_reference = 1;
  BtmArtifactKind artifact_kind = 2;
  string relative_path = 3;
  string sha256 = 4;
  int64 size_bytes = 5;
  int32 chunk_count = 6;
  string content_type = 7;
}

message BtmArtifactChunk {
  string artifact_reference = 1;
  BtmArtifactKind artifact_kind = 2;
  string relative_path = 3;
  int32 chunk_index = 4;
  int64 byte_offset = 5;
  bytes data = 6;
  string chunk_sha256 = 7;
  bool final_chunk = 8;
}

message DeliveredAnalysisFacts {
  // Accepted static fact artifacts owned by analysis-store-service.
  repeated de.burger.forensics.analytics.analysisjob.v1.AnalysisArtifactReference source_fact_artifacts = 1;
  // Accepted semantic artifacts, such as Joern CPG/CFG/DFG outputs.
  repeated de.burger.forensics.analytics.analysisjob.v1.AnalysisArtifactReference semantic_artifacts = 2;
  // Bounded inline targets selected from accepted facts.
  repeated InstrumentationTarget targets = 3;
  de.burger.forensics.analytics.analysisjob.v1.AnalysisCompleteness input_completeness = 4;
}

message InstrumentationTarget {
  string target_id = 1;
  string source_fact_id = 2;
  string semantic_node_id = 3;
  // Source-snapshot-relative path. Absolute paths, file URIs and parent
  // traversal are forbidden.
  string relative_path = 4;
  string fully_qualified_class_name = 5;
  string method_name = 6;
  string signature = 7;
  int32 line_number = 8;
  ProbeKind probe_kind = 9;
}

message BtmGenerationPolicy {
  int32 max_targets = 1;
  int64 max_artifact_bytes = 2;
  int64 timeout_seconds = 3;
  string rule_schema_version = 4;
  bool fail_on_incomplete_facts = 5;
}

message BtmRuleSummary {
  string rule_id = 1;
  string target_id = 2;
  string source_fact_id = 3;
  string relative_path = 4;
  string fully_qualified_class_name = 5;
  string method_name = 6;
  string signature = 7;
  int32 line_number = 8;
  ProbeKind probe_kind = 9;
}

message BtmGenerationSummary {
  int32 received_target_count = 1;
  int32 generated_rule_count = 2;
  int32 skipped_target_count = 3;
  int32 source_fact_artifact_count = 4;
  int32 semantic_artifact_count = 5;
  string producer_service = 6;
  string generator_version = 7;
  string rule_schema_version = 8;
}

message ReproducibilityMetadata {
  string facts_fingerprint = 1;
  string policy_fingerprint = 2;
  string generation_fingerprint = 3;
  string generator_version = 4;
  string deterministic_sort = 5;
}

message BtmDiagnostic {
  string code = 1;
  string message = 2;
  DiagnosticSeverity severity = 3;
  string source_snapshot_id = 4;
  string target_id = 5;
  // Opaque artifact key or relative generated artifact path only. Absolute
  // paths, file URIs, URL values and parent traversal are forbidden.
  string artifact_path = 6;
  bool retryable = 7;
  bool affects_completeness = 8;
}

message OperationStatus {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  string correlation_id = 4;
  repeated BtmDiagnostic diagnostics = 5;
}

enum ProbeKind {
  PROBE_KIND_UNSPECIFIED = 0;
  PROBE_KIND_METHOD_ENTRY = 1;
  PROBE_KIND_METHOD_EXIT = 2;
  PROBE_KIND_THROW = 3;
}

enum BtmArtifactKind {
  BTM_ARTIFACT_KIND_UNSPECIFIED = 0;
  BTM_ARTIFACT_KIND_RULE_FILE = 1;
  BTM_ARTIFACT_KIND_MANIFEST = 2;
}

enum DiagnosticSeverity {
  DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  DIAGNOSTIC_SEVERITY_INFO = 1;
  DIAGNOSTIC_SEVERITY_WARNING = 2;
  DIAGNOSTIC_SEVERITY_ERROR = 3;
}
